syntax = "proto3";

package micyou;

message MessageWrapper {
    AudioPacketMessageOrdered audioPacket = 1; // Used in TCP-only mode
    ConnectMessage connect = 2;               // Connection setup
    MuteMessage mute = 3;                     // Mute toggle
    PluginSyncMessage pluginSync = 4;         // Plugin sync state
    PingMessage ping = 5;                     // Ping for latency
    PongMessage pong = 6;                     // Pong for latency
    SecureClientHello secureClientHello = 7;  // Encrypted-mode handshake, client -> server
    SecureServerHello secureServerHello = 8;  // Encrypted-mode handshake, server -> client
    SecureConfirm secureConfirm = 9;          // Encrypted-mode handshake completion, client -> server
    SecureResult secureResult = 10;           // Pairing/handshake verdict, server -> client
}

// Suite value shared by all secure-handshake messages. Suite 1 is X25519 ECDH +
// Ed25519 identity signatures + HKDF-SHA256 + AES-256-GCM.
message SecureClientHello {
    // Bitmask of supported suites; bit N set means suite N+1 is supported.
    uint32 suiteMask = 1;
    bytes ephemeralPubKey = 2;
    bytes identityPubKey = 3;
    // Ed25519 signature over the canonical client-hello byte string defined by
    // SECURE_TRANSCRIPT_TAG conventions; never included in that string itself.
    bytes transcriptSignature = 4;
    string deviceName = 5;
}

message SecureServerHello {
    uint32 suite = 1; // 0 means "encryption unavailable, fall back to plaintext"
    bytes identityPubKey = 2;
    bytes ephemeralPubKey = 3;
    // Ed25519 signature over both encoded hellos (client hello including its
    // signature, server hello with this field empty), prefixed by the tag.
    bytes transcriptSignature = 4;
}

message SecureConfirm {
    string deviceName = 1;
}

message SecureResult {
    bool accepted = 1;
}

message ConnectMessage {
    // Zero identifies legacy clients that predate transport session isolation.
    int64 sessionId = 1;
}

message MuteMessage {
    bool isMuted = 1;
}

message PluginInfoMessage {
    string id = 1;
    string name = 2;
    string version = 3;
}

message PluginSyncMessage {
    repeated PluginInfoMessage plugins = 1;
    string platform = 2;
}

message PingMessage {
    int64 timestamp = 1;
    // New clients can distinguish a live TCP control channel from a live audio stream.
    // Older clients ignore these fields and continue using the heartbeat alone.
    bool audioHealthSupported = 2;
    bool audioHealthy = 3;
}

message PongMessage {
    int64 timestamp = 1;
}

message AudioPacketMessageOrdered {
    int32 sequenceNumber = 1;
    AudioPacketMessage audioPacket = 2;
    int64 timestamp = 3;
    bytes fecBuffer = 4;
    int32 fecSequenceNumber = 5;
    int64 sessionId = 6;
    // Original byte length of each source packet in the FEC group. Empty for legacy senders.
    repeated uint32 fecPacketLengths = 7;
}

message AudioPacketMessage {
    bytes buffer = 1;
    int32 sampleRate = 2;
    int32 channelCount = 3;
    int32 audioFormat = 4;
}
