[package]
name = "micyou-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "MicYou CLI/TUI - low-memory alternative to the desktop GUI"

[[bin]]
name = "micyou"
path = "src/main.rs"

[dependencies]
micyou-app = { path = "../../src-tauri" }
micyou-audio = { path = "../micyou-audio", features = ["dsp", "noise-suppression"] }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
log = "0.4.32"
cpal = "0.15.3"
ratatui = "0.29.0"
crossterm = "0.28.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.169"
