name: Android and Windows Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^project.version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: liberica
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Android release APK
        run: ./gradlew :composeApp:assembleRelease

      - name: Prepare Android artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          APK=$(find composeApp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "release-artifacts/MicYou-Android-${{ steps.version.outputs.version }}.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicYou-Android-${{ steps.version.outputs.version }}
          path: release-artifacts/MicYou-Android-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = (Select-String -Path gradle.properties -Pattern '^project\.version=').Line
          $version = $line.Split('=')[1].Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows build tools
        shell: pwsh
        run: choco install nasm innosetup -y --no-progress

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci --include=dev

      - name: Build Tauri application
        working-directory: tauri-app
        run: npx @tauri-apps/cli build --no-bundle

      - name: Build Inno Setup installer
        working-directory: tauri-app
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Path target/release -Filter 'micyou-app.exe' |
            Select-Object -First 1
          if (-not $binary) {
            throw 'Tauri executable was not found'
          }
          New-Item -ItemType Directory -Force -Path 'src-tauri/target/release' | Out-Null
          Copy-Item $binary.FullName 'src-tauri/target/release/MicYou.exe' -Force
          New-Item -ItemType Directory -Force -Path 'src-tauri/target/release/bundle/inno' | Out-Null
          iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" src-tauri/installer.iss

      - name: Prepare Windows artifact
        working-directory: tauri-app
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/inno -Filter '*.exe' |
            Select-Object -First 1
          if (-not $installer) {
            throw 'Inno Setup installer was not found'
          }
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item $installer.FullName "release-artifacts/MicYou-Win-${{ steps.version.outputs.version }}-installer.exe" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicYou-Win-${{ steps.version.outputs.version }}
          path: release-artifacts/MicYou-Win-${{ steps.version.outputs.version }}-installer.exe
          if-no-files-found: error

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^project.version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: MicYou-Android-${{ steps.version.outputs.version }}
          path: release-artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MicYou-Win-${{ steps.version.outputs.version }}
          path: release-artifacts

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s "release-artifacts/MicYou-Android-${{ steps.version.outputs.version }}.apk"
          test -s "release-artifacts/MicYou-Win-${{ steps.version.outputs.version }}-installer.exe"
          ls -lh release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MicYou v${{ steps.version.outputs.version }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            release-artifacts/MicYou-Android-${{ steps.version.outputs.version }}.apk
            release-artifacts/MicYou-Win-${{ steps.version.outputs.version }}-installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
